name: Deploy addon to beamup

on:
  workflow_dispatch:
  push:
    tags:
      - v*
    branches:
      - main

jobs:
  beamup-deploy:
    name: Deploy to beamup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
            ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Add beamup to known hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
          ssh-keyscan -H a.baby-beamup.club >> ~/.ssh/known_hosts
      - name: Add beamup remote repository
        run: git remote add beamup ${{ vars.BEAMUP_REPO }}
      - name: Deploy addon to beamup
        run: |
          git config user.name "github-cd"
          git config user.email "cd@github.com"
          git commit --allow-empty -m "Beamup empty auto commit"
          git push beamup HEAD:master --force
      - name: Create env variables
        env:
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          ADDON_HOSTNAME: ${{ vars.ADDON_HOSTNAME }}
        run: |
          ssh dokku@a.baby-beamup.club config:set ${{ vars.BEAMUP_APP }} OPENSUBTITLES_API_KEY="$OPENSUBTITLES_API_KEY"
          ssh dokku@a.baby-beamup.club config:set ${{ vars.BEAMUP_APP }} ADDON_HOSTNAME="$ADDON_HOSTNAME"
