name: Deploy addon to beamup

on:
  workflow_dispatch:
  push:
    tags:
      - v*
    branches:
      - main

jobs:
  beamup-deploy:
    name: Deploy to beamup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
            ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Add beamup to known hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
          ssh-keyscan -H a.baby-beamup.club >> ~/.ssh/known_hosts
      - name: Add beamup remote repository
        run: git remote add beamup ${{ vars.BEAMUP_REPO }}
      - name: Deploy addon to beamup
        run: |
          git config user.name "github-cd"
          git config user.email "cd@github.com"
          git commit --allow-empty -m "Beamup empty auto commit"

          # Beamup leaves a deploy lock behind when a deploy is interrupted, and
          # it cannot be cleared from here: apps:unlock is not among the commands
          # their ssh allows. It does clear on its own, usually within a couple
          # of minutes, so the push is retried rather than failing the release.
          # Anything that is not the lock fails immediately, so a broken build is
          # still a broken build.
          for attempt in $(seq 1 6); do
            if OUTPUT=$(git push beamup HEAD:master --force 2>&1); then
              echo "$OUTPUT" | tail -20
              echo "Deployed on attempt $attempt."
              exit 0
            fi

            echo "$OUTPUT" | tail -20

            if ! echo "$OUTPUT" | grep -q "deploy lock"; then
              echo "Push failed for a reason other than the deploy lock."
              exit 1
            fi

            echo "Deploy lock held, attempt $attempt of 6, retrying in 45s."
            sleep 45
          done

          echo "The deploy lock was still held after 6 attempts."
          exit 1
      - name: Create env variables
        env:
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          ADDON_HOSTNAME: ${{ vars.ADDON_HOSTNAME }}
        run: |
          ssh dokku@a.baby-beamup.club config:set ${{ vars.BEAMUP_APP }} OPENSUBTITLES_API_KEY="$OPENSUBTITLES_API_KEY"
          ssh dokku@a.baby-beamup.club config:set ${{ vars.BEAMUP_APP }} ADDON_HOSTNAME="$ADDON_HOSTNAME"
